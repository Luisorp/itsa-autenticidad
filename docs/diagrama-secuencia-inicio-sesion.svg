<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de secuencia: inicio de sesión</title>
  <desc id="desc">Diagrama de secuencia del inicio de sesión de la aplicación Laravel.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowOpen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#222" stroke-width="1.4"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #161616; }
      .heading { font-size: 30px; font-weight: 700; }
      .subheading { font-size: 17px; fill: #444; }
      .participant { fill: #f5f5f5; stroke: #333; stroke-width: 1.8; }
      .participant-text { font-size: 17px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .lifeline { stroke: #777; stroke-width: 1.4; stroke-dasharray: 8 7; }
      .activation { fill: #e8e8e8; stroke: #555; stroke-width: 1.2; }
      .call { stroke: #222; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .reply { stroke: #333; stroke-width: 1.6; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrowOpen); }
      .message { font-size: 15px; text-anchor: middle; }
      .frame { fill: none; stroke: #222; stroke-width: 1.6; }
      .frame-tab { fill: #eee; stroke: #222; stroke-width: 1.4; }
      .frame-label { font-size: 15px; font-weight: 700; }
      .guard { font-size: 14px; font-style: italic; fill: #333; }
      .actor-line { stroke: #222; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1900" height="1320" fill="#fff"/>
  <text class="heading" x="950" y="45" text-anchor="middle">DIAGRAMA DE SECUENCIA: INICIO DE SESIÓN</text>
  <text class="subheading" x="950" y="75" text-anchor="middle">Flujo de inicio de sesión en la aplicación web Laravel</text>

  <!-- Participante actor -->
  <circle cx="120" cy="112" r="16" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <path class="actor-line" d="M120 128 V169 M96 141 H144 M120 169 L98 194 M120 169 L142 194"/>
  <text class="participant-text" x="120" y="220"></text>
  <text class="participant-text" x="120" y="242">Usuario</text>
  
  <!-- Participantes y líneas de vida -->
  <rect class="participant" x="300" y="105" width="200" height="82" rx="4"/>
  <text class="participant-text" x="400" y="139">Navegador</text>
  <text class="participant-text" x="400" y="163">Vista auth.login</text>

  <rect class="participant" x="590" y="105" width="220" height="82" rx="4"/>
  <text class="participant-text" x="700" y="139">AuthenticatedSession</text>
  <text class="participant-text" x="700" y="163">Controller</text>

  <rect class="participant" x="900" y="105" width="240" height="82" rx="4"/>
  <text class="participant-text" x="1020" y="139">LoginRequest</text>
  <text class="participant-text" x="1020" y="163">Laravel Auth</text>

  <rect class="participant" x="1240" y="105" width="200" height="82" rx="4"/>
  <text class="participant-text" x="1340" y="139">Base de datos</text>
  <text class="participant-text" x="1340" y="163">tabla users</text>

  <rect class="participant" x="1540" y="105" width="250" height="82" rx="4"/>
  <text class="participant-text" x="1665" y="139">Sesión Laravel</text>
  <text class="participant-text" x="1665" y="163">y panel</text>

  <path class="lifeline" d="M120 250 V1280"/>
  <path class="lifeline" d="M400 187 V1280"/>
  <path class="lifeline" d="M700 187 V1280"/>
  <path class="lifeline" d="M1020 187 V1280"/>
  <path class="lifeline" d="M1340 187 V1280"/>
  <path class="lifeline" d="M1665 187 V1280"/>

  <!-- Activaciones -->
  <rect class="activation" x="393" y="282" width="14" height="1000"/>
  <rect class="activation" x="693" y="350" width="14" height="900"/>
  <rect class="activation" x="1013" y="414" width="14" height="710"/>
  <rect class="activation" x="1333" y="512" width="14" height="72"/>
  <rect class="activation" x="1658" y="1160" width="14" height="70"/>

  <!-- Solicitud inicial y presentación del formulario -->
  <path class="call" d="M145 270 H393"/>
  <text class="message" x="270" y="260">Abrir pantalla de acceso</text>
  <path class="call" d="M407 305 H693"/>
  <text class="message" x="550" y="295">GET /login</text>
  <path class="reply" d="M693 337 H407"/>
  <text class="message" x="550" y="328">Mostrar vista auth.login</text>
  <path class="reply" d="M393 365 H145"/>
  <text class="message" x="270" y="355">Presentar formulario</text>

  <!-- Envío y validaciones -->
  <path class="call" d="M145 405 H393"/>
  <text class="message" x="270" y="395">Ingresar correo y contraseña</text>
  <path class="call" d="M407 440 H693"/>
  <text class="message" x="550" y="430">POST /login</text>
  <path class="call" d="M707 475 H1013"/>
  <text class="message" x="860" y="465">Validar correo y contraseña</text>
  <path class="reply" d="M1013 510 H707"/>
  <text class="message" x="860" y="500">Solicitud validada</text>
  <path class="call" d="M707 545 H1013"/>
  <text class="message" x="860" y="535">authenticate()</text>
  <path class="call" d="M1027 580 H1125 V602 H1027"/>
  <text class="message" x="1075" y="570">Revisar límite de intentos</text>
  <path class="call" d="M1027 620 H1333"/>
  <text class="message" x="1180" y="610">Auth::attempt: buscar usuario por correo</text>
  <path class="reply" d="M1333 655 H1027"/>
  <text class="message" x="1180" y="645">Registro, hash de contraseña y estado activo</text>
  <path class="call" d="M1027 695 H1125 V717 H1027"/>
  <text class="message" x="1075" y="685">Comparar contraseña y estado activo</text>

  <!-- Resultado de autenticación -->
  <rect class="frame" x="310" y="740" width="1300" height="495"/>
  <path class="frame-tab" d="M310 740 h48 v28 h-48 z"/>
  <text class="frame-label" x="334" y="759" text-anchor="middle">alt</text>

  <text class="guard" x="370" y="790">[Correo no registrado o contraseña incorrecta]</text>
  <path class="call" d="M1027 820 H1125 V844 H1027"/>
  <text class="message" x="1075" y="810">Registrar intento fallido</text>
  <path class="reply" d="M693 872 H407"/>
  <text class="message" x="550" y="862">Devolver error de credenciales al formulario</text>
  <path class="reply" d="M393 905 H145"/>
  <text class="message" x="270" y="895">Mostrar mensaje de acceso no válido</text>

  <path d="M310 930 H1610" stroke="#444" stroke-width="1.3" stroke-dasharray="7 6"/>
  <text class="guard" x="370" y="957">[Credenciales correctas]</text>

  <path class="call" d="M1027 985 H1125 V1009 H1027"/>
  <text class="message" x="1075" y="975">Comprobar que la cuenta esté activa</text>
  <path d="M345 1030 h1220 v176 h-1220 z" class="frame"/>
  <path class="frame-tab" d="M345 1030 h48 v28 h-48 z"/>
  <text class="frame-label" x="369" y="1049" text-anchor="middle">alt</text>
  <text class="guard" x="410" y="1077">[Cuenta inactiva]</text>
  <path class="reply" d="M693 1100 H407"/>
  <text class="message" x="550" y="1090">Cerrar autenticación y mostrar aviso de cuenta desactivada</text>
  <path d="M345 1125 H1565" stroke="#444" stroke-width="1.2" stroke-dasharray="7 6"/>
  <text class="guard" x="410" y="1150">[Cuenta activa]</text>
  <path class="call" d="M707 1175 H1658"/>
  <text class="message" x="1180" y="1165">Regenerar ID de sesión y autenticar</text>
  <path class="reply" d="M1658 1205 H707"/>
  <text class="message" x="1180" y="1195">Redirigir al destino solicitado o al dashboard</text>
  <path class="reply" d="M693 1225 H407"/>
  <text class="message" x="550" y="1215">Devolver respuesta de redirección</text>
  <path class="reply" d="M393 1255 H145"/>
  <text class="message" x="270" y="1245">Acceder al sistema</text>

</svg>
