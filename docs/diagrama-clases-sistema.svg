    <text x="357" y="540">0..1</text><text x="357" y="642">0..*</text>
    <text x="615" y="442">1</text><text x="835" y="690">0..*</text>
    <text x="620" y="120">0..*</text><text x="1630" y="120">0..*</text>
    <text x="830" y="525">0..1</text><text x="615" y="744">0..1</text>
    <text x="1518" y="316">0..1</text><text x="1632" y="316">0..1</text>
