    <text class="field" x="872" y="732">+ id: bigint</text>
    <text class="field" x="872" y="759">+ titulo: string</text>
    <text class="field" x="872" y="786">+ resumen: text?</text>
    <text class="field" x="872" y="813">+ modalidad: string</text>
    <text class="field" x="872" y="840">+ carrera_id: bigint</text>
    <text class="field" x="872" y="867">+ estudiante_id: bigint</text>
    <text class="field" x="872" y="894">+ tutor_id: bigint?</text>
    <text class="field" x="872" y="921">+ anio: smallint</text>
    <text class="field" x="872" y="948">+ estado: enum</text>
    <text class="field" x="872" y="975">+ activo: boolean</text>
