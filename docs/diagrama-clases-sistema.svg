    <text x="1518" y="1120">1</text><text x="1632" y="1274">0..*</text>
    <text x="1512" y="585">1</text><text x="1910" y="1245">0..*</text>
    <text x="715" y="1325">0..*</text><text x="835" y="1325">1</text>
    <text x="715" y="1455">0..*</text><text x="835" y="1455">1</text>
