<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1720" viewBox="0 0 2300 1720" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de clases del sistema de autenticidad</title>
  <desc id="desc">Clases principales del sistema, con atributos, operaciones Eloquent y multiplicidades tomadas de los modelos y migraciones Laravel.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .page-title{font-size:34px;font-weight:700;letter-spacing:.4px}
      .class-title{font-size:23px;font-weight:700}
      .field,.method{font-size:18px}
      .multiplicity{font-size:17px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
      .association-name{font-size:16px;font-style:italic;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
      .class-box{fill:#fff;stroke:#111;stroke-width:2}
      .class-head{fill:#e8e8e8;stroke:#111;stroke-width:2}
      .divider{stroke:#111;stroke-width:1.5}
      .relation{fill:none;stroke:#222;stroke-width:2}
      .legend{font-size:16px;fill:#444}
    </style>
  </defs>
  <rect width="2300" height="1720" fill="#fff"/>
  <text class="page-title" x="1150" y="62" text-anchor="middle">DIAGRAMA DE CLASES — SISTEMA DE AUTENTICIDAD</text>

