    <text class="method" x="872" y="445">+ esGestor(): bool</text>
    <text class="method" x="872" y="471">+ esUsuario(): bool</text>
    <text class="method" x="872" y="497">+ carrera(): Carrera</text>
    <text class="method" x="872" y="523">+ estudiante(): Estudiante?</text>
    <text class="method" x="872" y="549">+ docente(): Docente?</text>
    <text class="method" x="872" y="575">+ reportesGenerados(): Reporte[]</text>
  </g>

