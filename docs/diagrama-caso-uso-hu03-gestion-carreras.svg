<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="title desc">
  <title id="title">Caso de uso HU03: Gestión de carreras</title>
  <desc id="desc">El Administrador consulta las carreras, registra nuevas, edita sus datos y las activa o desactiva. El sistema valida que el nombre y el código no estén duplicados. Al desactivar una carrera conserva sus datos históricos; no se contempla eliminarla.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .page-title{font-size:30px;font-weight:700}
      .system-title{font-size:21px;font-weight:700}
      .actor-label{font-size:20px;font-weight:700}
      .case-label{font-size:18px}
      .relation-label{font-size:15px;font-weight:700}
      .boundary{fill:#fff;stroke:#111;stroke-width:2.5}
      .use-case{fill:#fff;stroke:#111;stroke-width:2}
      .actor-line{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .association{fill:none;stroke:#333;stroke-width:1.8}
      .relation{fill:none;stroke:#111;stroke-width:1.7;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
    </marker>
  </defs>

  <rect width="1700" height="1050" fill="#fff"/>
  <text class="page-title" x="940" y="48" text-anchor="middle">CASO DE USO HU03 — GESTIÓN DE CARRERAS</text>

  <rect class="boundary" x="230" y="85" width="1430" height="880"/>


  <g aria-label="Asociación del Administrador">
    <path class="association" d="M162 455 L330 510"/>
  </g>

  <g aria-label="Actor Administrador">
    <circle cx="110" cy="405" r="21" class="actor-line"/>
    <path d="M110 426 L110 510 M58 455 L162 455 M110 510 L70 565 M110 510 L150 565" class="actor-line"/>
    <text class="actor-label" x="110" y="605" text-anchor="middle">Administrador</text>
  </g>

  <g aria-label="Relaciones entre los casos de uso">
    <!-- La gestión muestra el listado; desde este se puede iniciar una acción opcional. -->
    <path class="relation" d="M600 468 L705 230"/>
    <text class="relation-label" x="670" y="340">&lt;&lt;include&gt;&gt;</text>

    <path class="relation" d="M705 400 L605 475"/>
    <text class="relation-label" x="676" y="413">&lt;&lt;extend&gt;&gt;</text>

    <path class="relation" d="M705 590 L605 545"/>
    <text class="relation-label" x="672" y="570">&lt;&lt;extend&gt;&gt;</text>

    <path class="relation" d="M705 780 L570 565"/>
    <text class="relation-label" x="660" y="700">&lt;&lt;extend&gt;&gt;</text>

    <!-- Crear y editar comparten validaciones y persistencia. -->
    <path class="relation" d="M1075 390 L1230 370"/>
    <text class="relation-label" x="1062" y="365">&lt;&lt;include&gt;&gt;</text>

    <path class="relation" d="M1075 415 L1230 535"/>
    <text class="relation-label" x="1070" y="485">&lt;&lt;include&gt;&gt;</text>

    <path class="relation" d="M1075 570 L1230 390"/>
    <text class="relation-label" x="1066" y="470">&lt;&lt;include&gt;&gt;</text>

    <path class="relation" d="M1075 590 L1230 550"/>
    <text class="relation-label" x="1070" y="580">&lt;&lt;include&gt;&gt;</text>

    <path class="relation" d="M1075 780 L1230 780"/>
    <text class="relation-label" x="1062" y="770">&lt;&lt;include&gt;&gt;</text>
  </g>

  <g aria-label="Casos de uso">
    <ellipse class="use-case" cx="485" cy="510" rx="155" ry="65"/>
    <text class="case-label" x="485" y="503" text-anchor="middle">
      <tspan x="485" dy="0">Gestionar</tspan>
      <tspan x="485" dy="24">carreras</tspan>
    </text>

    <ellipse class="use-case" cx="890" cy="220" rx="185" ry="48"/>
    <text class="case-label" x="890" y="227" text-anchor="middle">Consultar listado de carreras</text>

    <ellipse class="use-case" cx="890" cy="400" rx="185" ry="48"/>
    <text class="case-label" x="890" y="407" text-anchor="middle">Registrar nueva carrera</text>

    <ellipse class="use-case" cx="890" cy="590" rx="185" ry="48"/>
    <text class="case-label" x="890" y="597" text-anchor="middle">Editar datos de carrera</text>

    <ellipse class="use-case" cx="890" cy="780" rx="185" ry="48"/>
    <text class="case-label" x="890" y="774" text-anchor="middle">
      <tspan x="890" dy="0">Activar o desactivar</tspan>
      <tspan x="890" dy="22">una carrera</tspan>
    </text>

    <ellipse class="use-case" cx="1380" cy="370" rx="150" ry="48"/>
    <text class="case-label" x="1380" y="364" text-anchor="middle">
      <tspan x="1380" dy="0">Validar nombre y código</tspan>
      <tspan x="1380" dy="22">(sin duplicados)</tspan>
    </text>

    <ellipse class="use-case" cx="1380" cy="550" rx="150" ry="48"/>
    <text class="case-label" x="1380" y="557" text-anchor="middle">Guardar datos</text>

    <ellipse class="use-case" cx="1380" cy="780" rx="150" ry="48"/>
    <text class="case-label" x="1380" y="774" text-anchor="middle">
      <tspan x="1380" dy="0">Cambiar estado y</tspan>
      <tspan x="1380" dy="22">conservar historial</tspan>
    </text>
  </g>
</svg>
