<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1750" viewBox="0 0 1500 1750" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de actividad: inicio de sesión</title>
  <desc id="desc">Actividades y decisiones del inicio de sesión para Administrador, Gestor y Usuario.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #161616; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #444; }
      .activity { fill: #fff; stroke: #333; stroke-width: 2; }
      .activity-text { font-size: 17px; text-anchor: middle; dominant-baseline: middle; }
      .decision { fill: #fff; stroke: #333; stroke-width: 2; }
      .decision-text { font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .flow { fill: none; stroke: #222; stroke-width: 1.8; marker-end: url(#arrow); }
      .branch { font-size: 15px; font-weight: 600; }
      .initial { fill: #222; }
      .final-outer { fill: #fff; stroke: #222; stroke-width: 2; }
      .final-inner { fill: #222; }
    </style>
  </defs>

  <rect width="1500" height="1750" fill="#fff"/>
  <text class="title" x="750" y="45" text-anchor="middle">DIAGRAMA DE ACTIVIDAD: INICIO DE SESIÓN</text>
  <text class="subtitle" x="750" y="76" text-anchor="middle">Flujo común para Administrador, Gestor y Usuario</text>

  <!-- Inicio y captura de credenciales -->
  <circle class="initial" cx="700" cy="135" r="13"/>
  <path class="flow" d="M700 148 V195"/>
  <rect class="activity" x="520" y="195" width="360" height="70" rx="22"/>
  <text class="activity-text" x="700" y="230">Mostrar formulario de acceso</text>
  <path class="flow" d="M700 265 V305"/>
  <rect class="activity" x="520" y="305" width="360" height="75" rx="22"/>
  <text class="activity-text" x="700" y="342">Ingresar correo y contraseña</text>

  <!-- Validación de los campos -->
  <path class="flow" d="M700 380 V400"/>
  <polygon class="decision" points="700,400 780,450 700,500 620,450"/>
  <text class="decision-text" x="700" y="450">¿Campos válidos?</text>
  <text class="branch" x="712" y="528">Sí</text>
  <path class="flow" d="M700 500 V555"/>
  <text class="branch" x="815" y="435">No</text>
  <path class="flow" d="M780 450 H960"/>
  <rect class="activity" x="960" y="410" width="330" height="80" rx="22"/>
  <text class="activity-text" x="1125" y="450">Mostrar errores de validación</text>
  <path class="flow" d="M1125 410 V340 H880"/>
  <text class="branch" x="1000" y="328">Corregir datos</text>

  <!-- Límite de intentos -->
  <rect class="activity" x="520" y="555" width="360" height="70" rx="22"/>
  <text class="activity-text" x="700" y="590">Revisar intentos de acceso</text>
  <path class="flow" d="M700 625 V655"/>
  <polygon class="decision" points="700,655 790,710 700,765 610,710"/>
  <text class="decision-text" x="700" y="703">¿Límite de 5</text>
  <text class="decision-text" x="700" y="722">intentos alcanzado?</text>
  <text class="branch" x="812" y="694">Sí</text>
  <path class="flow" d="M790 710 H970"/>
  <rect class="activity" x="970" y="670" width="330" height="80" rx="22"/>
  <text class="activity-text" x="1135" y="710">Informar bloqueo temporal</text>
  <path class="flow" d="M1135 750 V835"/>
  <circle class="final-outer" cx="1135" cy="858" r="16"/>
  <circle class="final-inner" cx="1135" cy="858" r="9"/>
  <text class="branch" x="712" y="792">No</text>
  <path class="flow" d="M700 765 V810"/>

  <!-- Comprobación de credenciales -->
  <rect class="activity" x="500" y="810" width="400" height="80" rx="22"/>
  <text class="activity-text" x="700" y="843">Buscar cuenta por correo y</text>
  <text class="activity-text" x="700" y="866">comprobar la contraseña</text>
  <path class="flow" d="M700 890 V925"/>
  <polygon class="decision" points="700,925 790,980 700,1035 610,980"/>
  <text class="decision-text" x="700" y="980">¿Credenciales</text>
  <text class="decision-text" x="700" y="999">correctas?</text>
  <text class="branch" x="815" y="963">No</text>
  <path class="flow" d="M790 980 H970"/>
  <rect class="activity" x="970" y="935" width="340" height="90" rx="22"/>
  <text class="activity-text" x="1140" y="970">Sumar intento fallido y</text>
  <text class="activity-text" x="1140" y="994">mostrar error de acceso</text>
  <path class="flow" d="M1140 935 V340 H880"/>
  <text class="branch" x="712" y="1060">Sí</text>
  <path class="flow" d="M700 1035 V1075"/>

  <!-- Estado de la cuenta -->
  <rect class="activity" x="520" y="1075" width="360" height="70" rx="22"/>
  <text class="activity-text" x="700" y="1110">Comprobar estado de la cuenta</text>
  <path class="flow" d="M700 1145 V1170"/>
  <polygon class="decision" points="700,1170 790,1225 700,1280 610,1225"/>
  <text class="decision-text" x="700" y="1225">¿Cuenta activa?</text>
  <text class="branch" x="815" y="1208">No</text>
  <path class="flow" d="M790 1225 H970"/>
  <rect class="activity" x="970" y="1180" width="340" height="90" rx="22"/>
  <text class="activity-text" x="1140" y="1215">Cerrar autenticación y avisar</text>
  <text class="activity-text" x="1140" y="1239">que la cuenta está desactivada</text>
  <path class="flow" d="M1140 1270 V1360"/>
  <circle class="final-outer" cx="1140" cy="1383" r="16"/>
  <circle class="final-inner" cx="1140" cy="1383" r="9"/>
  <text class="branch" x="712" y="1307">Sí</text>
  <path class="flow" d="M700 1280 V1320"/>

  <!-- Sesión correcta -->
  <rect class="activity" x="520" y="1320" width="360" height="65" rx="22"/>
  <text class="activity-text" x="700" y="1352">Limpiar intentos fallidos</text>
  <path class="flow" d="M700 1385 V1420"/>
  <rect class="activity" x="520" y="1420" width="360" height="65" rx="22"/>
  <text class="activity-text" x="700" y="1452">Regenerar el ID de sesión</text>
  <path class="flow" d="M700 1485 V1520"/>
  <rect class="activity" x="520" y="1520" width="360" height="75" rx="22"/>
  <text class="activity-text" x="700" y="1557">Redirigir al destino o al panel</text>
  <path class="flow" d="M700 1595 V1640"/>
  <circle class="final-outer" cx="700" cy="1663" r="16"/>
  <circle class="final-inner" cx="700" cy="1663" r="9"/>
</svg>
