<rect class="panel" x="45" y="378" width="1010" height="88"/>
<text x="550" y="416" text-anchor="middle" font-size="27" font-weight="700">[Porcentaje] % de similitud</text>
<text x="550" y="444" text-anchor="middle" font-size="14">Entre [Proyecto A] y [Proyecto B]</text>

<text x="45" y="510" font-size="17" font-weight="700">Fragmentos con posibles coincidencias</text>
<rect class="panel" x="45" y="526" width="485" height="148"/>
<rect class="panel" x="570" y="526" width="485" height="148"/>
