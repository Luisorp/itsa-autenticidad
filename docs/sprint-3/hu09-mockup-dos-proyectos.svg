<text x="587" y="596" font-size="14">[Fragmento coincidente del proyecto B]</text>
<text x="62" y="636" font-size="13">[Porcentaje de coincidencia textual]</text>
<text x="587" y="636" font-size="13">[Porcentaje de coincidencia textual]</text>
