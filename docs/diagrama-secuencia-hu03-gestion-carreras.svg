<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2110" viewBox="0 0 1700 2110" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de secuencia HU03: Gestión de carreras</title>
  <desc id="desc">Secuencia del Administrador con la vista Blade, CarreraController de Laravel y la base de datos para consultar, crear, editar y activar o desactivar carreras. Se muestran las validaciones de unicidad y que al desactivar se conserva el historial.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .title{font-size:28px;font-weight:700}
      .participant{font-size:18px;font-weight:700}
      .message-label{font-size:14px}
      .section-label{font-size:16px;font-weight:700}
      .guard{font-size:14px;font-weight:700}
      .lifeline{stroke:#777;stroke-width:1.5;stroke-dasharray:7 7}
      .request{stroke:#111;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .response{stroke:#111;stroke-width:1.6;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
      .frame{fill:#fff;stroke:#111;stroke-width:1.8}
      .frame-head{fill:#f2f2f2;stroke:#111;stroke-width:1.5}
      .divider{stroke:#555;stroke-width:1.4;stroke-dasharray:7 5}
      .participant-box{fill:#f7f7f7;stroke:#111;stroke-width:1.5}
      .db-shape{fill:#f7f7f7;stroke:#111;stroke-width:1.5}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1700" height="2110" fill="#fff"/>
  <text class="title" x="850" y="45" text-anchor="middle">DIAGRAMA DE SECUENCIA — HU03: GESTIÓN DE CARRERAS</text>

  <g aria-label="Participantes">
    <circle cx="130" cy="92" r="18" fill="#fff" stroke="#111" stroke-width="2"/>
    <path d="M130 110 L130 150 M105 126 L155 126 M130 150 L110 178 M130 150 L150 178" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"/>
    <text class="participant" x="130" y="205" text-anchor="middle">Administrador</text>

    <rect class="participant-box" x="365" y="85" width="220" height="58" rx="4"/>
    <text class="participant" x="475" y="120" text-anchor="middle">Vista web (Blade)</text>

    <rect class="participant-box" x="785" y="85" width="260" height="58" rx="4"/>
    <text class="participant" x="915" y="120" text-anchor="middle">Backend Laravel</text>

    <path class="db-shape" d="M1295 90 C1295 70 1505 70 1505 90 L1505 145 C1505 165 1295 165 1295 145 Z"/>
    <ellipse cx="1400" cy="90" rx="105" ry="20" fill="#f7f7f7" stroke="#111" stroke-width="1.5"/>
    <path d="M1295 145 C1295 165 1505 165 1505 145" fill="none" stroke="#111" stroke-width="1.5"/>
    <text class="participant" x="1400" y="127" text-anchor="middle">Base de datos</text>
  </g>

  <g class="lifeline" aria-hidden="true">
    <path d="M130 215 V2070"/><path d="M475 145 V2070"/><path d="M915 145 V2070"/><path d="M1400 165 V2070"/>
  </g>

  <!-- Consulta del listado -->
  <rect class="frame" x="35" y="235" width="1630" height="275"/>
  <rect class="frame-head" x="650" y="220" width="400" height="32"/>
  <text class="section-label" x="850" y="242" text-anchor="middle">Consultar carreras</text>
  <path class="request" d="M130 280 H475"/><text class="message-label" x="302" y="271" text-anchor="middle">Abrir sección “Carreras”</text>
  <path class="request" d="M475 320 H915"/><text class="message-label" x="695" y="311" text-anchor="middle">GET /carreras [auth + admin]</text>
  <text class="message-label" x="935" y="348">Middleware valida sesión y rol Administrador</text>
  <path class="request" d="M915 375 H1400"/><text class="message-label" x="1157" y="366" text-anchor="middle">SELECT carreras ORDER BY nombre, paginadas (10)</text>
  <path class="response" d="M1400 408 H915"/><text class="message-label" x="1157" y="399" text-anchor="middle">Registros de carreras</text>
  <path class="response" d="M915 442 H475"/><text class="message-label" x="695" y="433" text-anchor="middle">Renderizar carreras.index con el listado</text>
  <path class="response" d="M475 476 H130"/><text class="message-label" x="302" y="467" text-anchor="middle">Mostrar carreras y acciones disponibles</text>

  <!-- Registro -->
  <rect class="frame" x="35" y="535" width="1630" height="485"/>
  <rect class="frame-head" x="660" y="520" width="380" height="32"/>
  <text class="section-label" x="850" y="542" text-anchor="middle">opt [Registrar carrera]</text>
  <path class="request" d="M130 580 H475"/><text class="message-label" x="302" y="571" text-anchor="middle">Elegir “Nueva carrera”</text>
  <path class="request" d="M475 615 H915"/><text class="message-label" x="695" y="606" text-anchor="middle">GET /carreras/create</text>
  <path class="response" d="M915 650 H475"/><text class="message-label" x="695" y="641" text-anchor="middle">Mostrar formulario vacío</text>
  <path class="request" d="M130 685 H475"/><text class="message-label" x="302" y="676" text-anchor="middle">Ingresar nombre y código opcional</text>
  <path class="request" d="M475 720 H915"/><text class="message-label" x="695" y="711" text-anchor="middle">POST /carreras</text>
  <text class="message-label" x="935" y="747">Validar nombre requerido y único; código opcional y único</text>

  <rect class="frame" x="755" y="770" width="865" height="225"/>
  <path class="divider" d="M755 878 H1620"/>
  <text class="guard" x="770" y="794">alt</text>
  <text class="guard" x="790" y="824">[Datos inválidos]</text>
  <path class="response" d="M915 849 H475"/><text class="message-label" x="695" y="840" text-anchor="middle">Volver al formulario con errores; no se guarda</text>
  <text class="guard" x="790" y="905">[Datos válidos]</text>
  <path class="request" d="M915 930 H1400"/><text class="message-label" x="1157" y="921" text-anchor="middle">INSERT carrera (nombre, código, activo)</text>
  <path class="response" d="M1400 958 H915"/><text class="message-label" x="1157" y="949" text-anchor="middle">Carrera creada</text>
  <path class="response" d="M915 985 H475"/><text class="message-label" x="695" y="976" text-anchor="middle">Redirigir al listado + mensaje de éxito</text>

  <!-- Edición -->
  <rect class="frame" x="35" y="1045" width="1630" height="555"/>
  <rect class="frame-head" x="665" y="1030" width="370" height="32"/>
  <text class="section-label" x="850" y="1052" text-anchor="middle">opt [Editar carrera]</text>
  <path class="request" d="M130 1090 H475"/><text class="message-label" x="302" y="1081" text-anchor="middle">Elegir “Editar” en una carrera</text>
  <path class="request" d="M475 1125 H915"/><text class="message-label" x="695" y="1116" text-anchor="middle">GET /carreras/{carrera}/edit</text>
  <path class="request" d="M915 1160 H1400"/><text class="message-label" x="1157" y="1151" text-anchor="middle">Buscar carrera por identificador (route model binding)</text>
  <path class="response" d="M1400 1192 H915"/><text class="message-label" x="1157" y="1183" text-anchor="middle">Datos actuales de la carrera</text>
  <path class="response" d="M915 1225 H475"/><text class="message-label" x="695" y="1216" text-anchor="middle">Mostrar formulario con nombre y código</text>
  <path class="request" d="M130 1260 H475"/><text class="message-label" x="302" y="1251" text-anchor="middle">Modificar datos y guardar</text>
  <path class="request" d="M475 1295 H915"/><text class="message-label" x="695" y="1286" text-anchor="middle">PUT /carreras/{carrera}</text>
  <text class="message-label" x="935" y="1322">Validar nombre/código únicos, excluyendo la carrera actual</text>

  <rect class="frame" x="755" y="1345" width="865" height="220"/>
  <path class="divider" d="M755 1450 H1620"/>
  <text class="guard" x="770" y="1369">alt</text>
  <text class="guard" x="790" y="1397">[Validación fallida]</text>
  <path class="response" d="M915 1420 H475"/><text class="message-label" x="695" y="1411" text-anchor="middle">Volver al formulario con errores; no se actualiza</text>
  <text class="guard" x="790" y="1478">[Datos válidos]</text>
  <path class="request" d="M915 1503 H1400"/><text class="message-label" x="1157" y="1494" text-anchor="middle">UPDATE carreras SET nombre, código</text>
  <path class="response" d="M1400 1530 H915"/><text class="message-label" x="1157" y="1521" text-anchor="middle">Carrera actualizada</text>
  <path class="response" d="M915 1560 H475"/><text class="message-label" x="695" y="1551" text-anchor="middle">Redirigir al listado + mensaje de éxito</text>

  <!-- Activación o desactivación -->
  <rect class="frame" x="35" y="1625" width="1630" height="390"/>
  <rect class="frame-head" x="620" y="1610" width="460" height="32"/>
  <text class="section-label" x="850" y="1632" text-anchor="middle">opt [Activar o desactivar carrera]</text>
  <path class="request" d="M130 1670 H475"/><text class="message-label" x="302" y="1661" text-anchor="middle">Elegir “Activar” o “Desactivar”</text>
  <path class="request" d="M475 1705 H915"/><text class="message-label" x="695" y="1696" text-anchor="middle">PATCH /carreras/{carrera}/toggle-activo</text>
  <text class="message-label" x="935" y="1732">El backend cambia el valor actual de activo (true/false)</text>
  <path class="request" d="M915 1760 H1400"/><text class="message-label" x="1157" y="1751" text-anchor="middle">UPDATE carreras SET activo = !activo</text>
  <path class="response" d="M1400 1792 H915"/><text class="message-label" x="1157" y="1783" text-anchor="middle">Estado actualizado; no se eliminan datos históricos</text>
  <path class="response" d="M915 1825 H475"/><text class="message-label" x="695" y="1816" text-anchor="middle">Redirigir al listado + mensaje de estado</text>
  <path class="request" d="M475 1865 H915"/><text class="message-label" x="695" y="1856" text-anchor="middle">GET /carreras</text>
  <path class="request" d="M915 1900 H1400"/><text class="message-label" x="1157" y="1891" text-anchor="middle">Consultar listado actualizado</text>
  <path class="response" d="M1400 1932 H915"/><text class="message-label" x="1157" y="1923" text-anchor="middle">Carreras activas e inactivas</text>
  <path class="response" d="M915 1965 H475"/><text class="message-label" x="695" y="1956" text-anchor="middle">Mostrar estado actualizado</text>
</svg>
