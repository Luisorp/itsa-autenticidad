<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Mockup HU02: Gestión de usuarios</title>
  <desc id="desc">Propuesta visual de la pantalla de administración de usuarios: filtros por rol, listado, creación, edición y activación o desactivación de cuentas.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .nav{font-size:15px;fill:#e9f2ed}
      .muted{fill:#718079}
      .body{fill:#24332c}
      .small{font-size:13px}
      .medium{font-size:15px}
      .table-head{font-size:13px;font-weight:700;fill:#627168}
      .cell{font-size:14px;fill:#26372e}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#173d2c" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1440" height="960" fill="#f4f7f5"/>

  <!-- Barra lateral -->
  <rect width="245" height="960" fill="#103d2e"/>
  <path d="M30 31 L46 25 L62 31 V44 Q62 61 46 68 Q30 61 30 44 Z" fill="#a7e36d"/>
  <path d="M38 44 L44 50 L54 38" fill="none" stroke="#10452f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="75" y="43" fill="#fff" font-size="16" font-weight="700">Sistema de</text>
  <text x="75" y="63" fill="#fff" font-size="16" font-weight="700">autenticidad</text>
  <text x="28" y="112" fill="#9bb8a8" font-size="11" font-weight="700" letter-spacing="1.2">MENÚ PRINCIPAL</text>

  <g class="nav">
    <rect x="16" y="132" width="213" height="46" rx="9" fill="transparent"/>
    <circle cx="39" cy="155" r="8" fill="none" stroke="#cfe2d7" stroke-width="1.8"/>
    <path d="M28 168 Q39 157 50 168" fill="none" stroke="#cfe2d7" stroke-width="1.8"/>
    <text x="65" y="160">Inicio</text>

    <rect x="16" y="188" width="213" height="46" rx="9" fill="transparent"/>
    <path d="M30 202 H49 L53 209 V223 H30 Z M35 198 H49 L52 202" fill="none" stroke="#cfe2d7" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="65" y="216">Proyectos</text>

    <text x="28" y="277" fill="#9bb8a8" font-size="11" font-weight="700" letter-spacing="1.2">ADMINISTRACIÓN</text>
    <rect x="16" y="292" width="213" height="48" rx="9" fill="#1d684b"/>
    <circle cx="39" cy="316" r="7" fill="none" stroke="#fff" stroke-width="1.8"/>
    <circle cx="49" cy="319" r="5" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M28 331 Q39 319 49 331 M42 331 Q50 324 57 331" fill="none" stroke="#fff" stroke-width="1.6"/>
    <text x="68" y="321" fill="#fff" font-weight="700">Usuarios</text>

    <rect x="16" y="348" width="213" height="46" rx="9" fill="transparent"/>
    <path d="M30 360 H49 V380 H30 Z M34 355 H45 V360 M34 366 H45 M34 372 H45" fill="none" stroke="#cfe2d7" stroke-width="1.7"/>
    <text x="65" y="377">Carreras</text>
