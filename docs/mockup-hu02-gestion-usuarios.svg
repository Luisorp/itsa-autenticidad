  <rect x="1248" y="697" width="36" height="34" rx="6" fill="#fff" stroke="#d8e0db"/>
  <text x="1266" y="719" text-anchor="middle" fill="#526057" font-size="13">2</text>
  <rect x="1291" y="697" width="84" height="34" rx="6" fill="#fff" stroke="#d8e0db"/>
  <text x="1333" y="719" text-anchor="middle" fill="#526057" font-size="12">Siguiente</text>

  <text x="285" y="890" fill="#8a9690" font-size="12">Mockup de referencia HU02 · Datos ficticios para representar la interfaz</text>
</svg>
