  <line x1="285" y1="680" x2="1395" y2="680" stroke="#e7ece8"/>
  <text x="315" y="718" class="muted" font-size="13">Mostrando cuentas del rol seleccionado</text>
  <rect x="1114" y="697" width="84" height="34" rx="6" fill="#fff" stroke="#d8e0db"/>
