  <circle cx="334" cy="562" r="17" fill="#e8f2ec"/>
  <text x="334" y="567" text-anchor="middle" fill="#276347" font-size="12" font-weight="700">LR</text>
  <text x="360" y="559" class="cell" font-weight="700">Luis Rivera</text>
  <text x="510" y="559" class="cell">luis.rivera@ejemplo.edu</text>
  <text x="750" y="559" class="cell">Usuario</text>
  <text x="850" y="559" class="cell">Contabilidad</text>
  <rect x="1028" y="542" width="68" height="27" rx="13" fill="#e6f4eb"/>
  <circle cx="1041" cy="555" r="4" fill="#20844c"/>
  <text x="1051" y="560" fill="#1e7042" font-size="12" font-weight="700">Activo</text>
  <rect x="1130" y="539" width="92" height="32" rx="6" fill="#fff" stroke="#d5ded8"/>
  <text x="1176" y="560" text-anchor="middle" fill="#34473c" font-size="13" font-weight="700">Editar</text>
  <rect x="1230" y="539" width="130" height="32" rx="6" fill="#f2f4f3" stroke="#d5ded8"/>
  <text x="1295" y="560" text-anchor="middle" fill="#46534c" font-size="13" font-weight="700">Desactivar</text>
  <line x1="305" y1="593" x2="1375" y2="593" stroke="#eef1ef"/>

