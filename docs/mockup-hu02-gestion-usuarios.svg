  <text x="334" y="640" text-anchor="middle" fill="#75683b" font-size="12" font-weight="700">CE</text>
  <text x="360" y="632" class="cell" font-weight="700">Cuenta de ejemplo</text>
  <text x="510" y="632" class="cell">persona@ejemplo.edu</text>
  <text x="750" y="632" class="cell">Usuario</text>
  <text x="850" y="632" class="cell">—</text>
