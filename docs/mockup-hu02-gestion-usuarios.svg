  <text x="365" y="238" class="body" font-size="15" font-weight="700">Administradores</text>
  <text x="365" y="270" class="muted" font-size="13">03 cuentas</text>

  <circle cx="690" cy="251" r="22" fill="#edf3ef"/>
  <path d="M681 250 A9 9 0 1 1 699 250 M674 269 Q690 250 706 269" fill="none" stroke="#4d6a59" stroke-width="2"/>
