  <path d="M1048 250 A9 9 0 1 1 1066 250 M1041 269 Q1057 250 1073 269" fill="none" stroke="#0b6944" stroke-width="2"/>
  <text x="1097" y="238" class="body" font-size="15" font-weight="700">Usuarios</text>
  <text x="1097" y="270" fill="#0b6944" font-size="13">12 cuentas · seleccionada</text>

