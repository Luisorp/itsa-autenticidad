  <circle cx="1041" cy="482" r="4" fill="#20844c"/>
  <text x="1051" y="487" fill="#1e7042" font-size="12" font-weight="700">Activo</text>
  <rect x="1130" y="466" width="92" height="32" rx="6" fill="#fff" stroke="#d5ded8"/>
  <text x="1176" y="487" text-anchor="middle" fill="#34473c" font-size="13" font-weight="700">Editar</text>
  <rect x="1230" y="466" width="130" height="32" rx="6" fill="#f2f4f3" stroke="#d5ded8"/>
  <text x="1295" y="487" text-anchor="middle" fill="#46534c" font-size="13" font-weight="700">Desactivar</text>
  <line x1="305" y1="520" x2="1375" y2="520" stroke="#eef1ef"/>

